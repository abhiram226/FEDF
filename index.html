<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyTrack - Flight Status Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <h1 class="logo">✈ SkyTrack</h1>

      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Flights</a></li>
        <li><a href="#">Status</a></li>
        <li><a href="#">Alerts</a></li>
      </ul>
    </nav>
  </header>


  <!-- Hero Section -->
  <section class="hero">

    <div class="hero-content">
      <p class="tagline">REAL-TIME AIRLINE MONITORING</p>

      <h2>
        Flight Status <br>
        <span>Tracker</span>
      </h2>

      <p>
        Track departures, arrivals, delays, gate updates,
        and live airline information with a responsive modern interface.
      </p>

      <button id="trackBtn">Track Flight</button>
    </div>


    <!-- Flight Card -->
    <div class="flight-card">

      <div class="card-top">
        <div>
          <p>Flight Number</p>
          <h3>AI-302</h3>
        </div>

        <span class="status">ON TIME</span>
</html>
